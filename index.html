<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOD Web Arcade | Browser Games</title>
  <meta
    name="description"
    content="Minimal browser games by DOD Web Arcade. Open each game on its own page and play on desktop or mobile."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Syne:wght@500;700;800&display=swap"

      <a class="brand" href="index.html" aria-label="DOD Web Arcade home">

          <img class="brand-mark-image" src="dodwebarcadelogo.png" alt="DOD Web Arcade logo">

        <span class="brand-copy">

      <span>More from DOD Web Studio</span>
      <a class="footer-link" href="https://dodwebstudio.com" target="_blank" rel="noopener noreferrer" aria-label="Open dodwebstudio.com in a new tab">dodwebstudio.com</a>
